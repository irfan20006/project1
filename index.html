<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
      rel="stylesheet"
    />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="screen active"  id="start-screen">
        <h1>Quiz Time!</h1>
        <p>Test Your Knowledge With These Fun Questions</p>
        <button id="start-btn">Start Quiz</button>
      </div>

      <div class="screen " id="quiz-screen">
        <div class="quiz-header">
          <h2 id="question-text">sfdghsdfgs fsdrgsdr</h2>
          <div id="quiz-info">
            <p>
              Question <span id="current-question">1</span> of <span id="total-questions"></span>
            </p>
            <p>Score: <span id="score">0</span></p>
          </div>
        </div>
        <div id="answers-container" class="answers-container"></div>

        <div id="progress-bar">
          <div class="progress" id="progress"></div>
        </div>
      </div>

      <div class="screen" id="result-screen">
        <h1>Quiz Results</h1>
        <div class="result-info">
          <p>
            You Scored <span id="final-result">0</span>Out Of
            <span id="max-score"></span>
          </p>
        </div>
        <div id="result-message">good job</div>

        <button id="restart-btn">Restart Quiz</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
